<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Medicine Box</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<h1>💊 Smart Medicine Box</h1>

<div id="time">
Loading Time...
</div>

</header>

<div class="container">

<div class="card">

<h2>Medicine Information</h2>

<p><b>Medicine :</b>
<span id="medicine">Paracetamol</span></p>

<p><b>Time :</b>
<span id="medicineTime">08:00 AM</span></p>

<p><b>Status :</b>
<span id="status">Waiting</span></p>

</div>

<div class="card">

<h2>ESP32 Status</h2>

<p>Connection :
<span id="espStatus">Disconnected</span></p>

<p>Door :
<span id="doorStatus">Closed</span></p>

<p>RFID :
<span id="rfidStatus">Waiting</span></p>

<p>Alarm :
<span id="alarmStatus">OFF</span></p>

</div>

<div class="card">

<h2>Sensor Status</h2>

<p>Touch :
<span id="touchStatus">Waiting</span></p>

<p>Ultrasonic :
<span id="distance">0 cm</span></p>

</div>

<div class="card">

<h2>Control Panel</h2>

<button onclick="openDoor()">
Open Box
</button>

<button onclick="closeDoor()">
Close Box
</button>

<button onclick="stopAlarm()">
Stop Alarm
</button>

</div>

</div>

<footer>

Developed By Tushar Sorte

</footer>

<script src="script.js"></script>

</body>

</html>
